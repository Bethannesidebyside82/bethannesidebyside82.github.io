name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A811F5: ${{ secrets.A811F5 }}
          B749A6: ${{ secrets.B749A6 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A811F5', ''), os.environ.get('B749A6', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 9277c7e80614b8bf882ec318c3d3be49 -->', a)
          if b:
              patched = patched.replace('<!-- ab09eb56a8fd452e0e2a5aca -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
